name: Deploy Decolar Consórcios to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# Permissões necessárias para publicar via GitHub Pages Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas uma publicação simultânea
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Executar script de build (PowerShell)
        shell: pwsh
        run: ./build.ps1 -OutputDir dist

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fazer upload do artefato (dist/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
